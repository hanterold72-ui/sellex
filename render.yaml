services:
  # ============================================
  # BACKEND API (FastAPI) - путь к Dockerfile из корня
  # ============================================
  - type: web
  name: sellex-api
  runtime: docker
  plan: free
  region: frankfurt
  branch: main
  dockerfilePath: ./backend Dockerfile
  healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sellex-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: sellex-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: APP_NAME
        value: Sellex
      - key: APP_URL
        value: https://sellex-api.onrender.com
      - key: CORS_ORIGINS
        value: https://sellex.ru,https://www.sellex.ru,https://sellex-frontend.onrender.com
      - key: AI_PROVIDER
        value: openrouter
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false

  # ============================================
  # FRONTEND (React static)
  # ============================================
  - type: web
    name: sellex-frontend
    runtime: static
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./build
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        value: https://sellex-api.onrender.com
      - key: NODE_VERSION
        value: 18.18.0

  # ============================================
  # REDIS
  # ============================================
  - type: redis
    name: sellex-redis
    plan: free
    region: frankfurt
    maxmemoryPolicy: noeviction
    ipAllowList: []

# ============================================
# DATABASE
# ============================================
databases:
  - name: sellex-db
    databaseName: sellex
    user: sellex_user
    plan: free
    region: frankfurt
    postgresMajorVersion: "15"
    ipAllowList: []