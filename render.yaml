services:
  # ============================================
  # BACKEND API (FastAPI)
  # ============================================
  - type: web
    name: sellex-api
    runtime: docker
    plan: 0.1c-512mb        # ← ИЗМЕНЕНО (было free)
    region: frankfurt
    branch: main
    rootDir: .
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sellex-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: sellex-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: APP_NAME
        value: Sellex
      - key: APP_URL
        value: https://sellex-api.onrender.com
      - key: CORS_ORIGINS
        value: https://sellex.ru,https://www.sellex.ru,https://sellex-frontend.onrender.com
      - key: AI_PROVIDER
        value: openrouter
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GENERATED_DIR
        value: /app/generated
      - key: UPLOAD_DIR
        value: /app/uploads
      - key: PYTHON_VERSION
        value: 3.11.0

  # ============================================
  # FRONTEND (React static) — БЕЗ region и plan
  # ============================================
  - type: web
    name: sellex-frontend
    runtime: static
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./build
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    envVars:
      - key: REACT_APP_API_URL
        value: https://sellex-api.onrender.com
      - key: REACT_APP_APP_NAME
        value: Sellex
      - key: NODE_VERSION
        value: 18.18.0

  # ============================================
  # REDIS
  # ============================================
  - type: redis
    name: sellex-redis
    plan: free              # ← оставить
    region: frankfurt
    maxmemoryPolicy: noeviction
    ipAllowList: []

# ============================================
# DATABASE
# ============================================
databases:
  - name: sellex-db
    databaseName: sellex
    user: sellex_user
    plan: free              # ← оставить
    region: frankfurt
    postgresMajorVersion: "15"
    ipAllowList: []