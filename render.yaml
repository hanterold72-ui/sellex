services:
  - type: web
    name: sellex-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sellex-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: sellex-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: APP_NAME
        value: Sellex
      - key: APP_URL
        value: https://sellex-api.onrender.com
      - key: CORS_ORIGINS
        value: https://sellex.ru,https://www.sellex.ru,https://sellex-frontend.onrender.com
      - key: AI_PROVIDER
        value: openrouter
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
